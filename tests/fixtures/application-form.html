<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Controlled Application Fixture</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 20px; }
    label { display: block; margin: 14px 0; }
    input, textarea, select, button { display: block; width: 100%; box-sizing: border-box; padding: 8px; }
    input[type="checkbox"] { display: inline; width: auto; }
    button { margin-top: 20px; }
    [role="alert"], [role="status"] { padding: 10px 0; }
  </style>
</head>
<body data-fixture="findjobs-controlled-v1">
  <main>
    <h1>Data Analysis Intern</h1>
    <p id="company" data-company="Fixture Labs">Fixture Labs</p>
    <p id="job-id" data-job-id="golden-demo-001">Job ID: golden-demo-001</p>
    <form id="application-form" action="/fixtures/submit" method="post" data-schema-version="1">
      <input type="hidden" id="job-id-field" name="jobId" value="golden-demo-001">
      <label for="full-name">Full name</label>
      <input id="full-name" name="fullName" autocomplete="off" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="off" required>

      <label for="city">Current city</label>
      <input id="city" name="city" autocomplete="off" required>

      <label for="cover-letter">Cover letter</label>
      <textarea id="cover-letter" name="coverLetter" required></textarea>

      <label for="resume">Resume</label>
      <input id="resume" name="resume" type="file" accept=".txt,.pdf,.docx" required>

      <section id="sensitive-fields" hidden>
        <h2>Sensitive fields</h2>
        <label for="expected-salary">Expected salary</label>
        <input id="expected-salary" name="expectedSalary">

        <label for="work-authorization">Work authorization</label>
        <select id="work-authorization" name="workAuthorization">
          <option value="">Select</option>
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>

        <label><input id="legal-consent" name="legalConsent" type="checkbox"> I certify these answers</label>
      </section>

      <div id="challenge" role="alert" hidden>Complete CAPTCHA manually</div>
      <button id="final-submit" name="finalSubmit" type="submit">Submit test application</button>
    </form>
    <output id="result" role="status" aria-live="polite"></output>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const scenario = params.get('scenario') || 'success';
      const caseId = params.get('case') || 'default';
      const form = document.querySelector('#application-form');
      const result = document.querySelector('#result');
      const challenge = document.querySelector('#challenge');
      const sensitive = document.querySelector('#sensitive-fields');
      const countKey = `findjobs-fixture-submit-count:${scenario}:${caseId}`;

      sessionStorage.setItem(countKey, sessionStorage.getItem(countKey) || '0');
      document.body.dataset.scenario = scenario;
      document.body.dataset.caseId = caseId;

      if (caseId === 'retry-cycle') {
        const retryJobId = 'golden-demo-retry-001';
        document.querySelector('h1').textContent = 'Data Analysis Intern - Retry Fixture';
        const jobIdDisplay = document.querySelector('#job-id');
        jobIdDisplay.dataset.jobId = retryJobId;
        jobIdDisplay.textContent = `Job ID: ${retryJobId}`;
        document.querySelector('#job-id-field').value = retryJobId;
        form.dataset.schemaVersion = 'retry-1';
        document.body.dataset.submitCount = '0';
        document.body.dataset.applicationStatus = 'not_submitted';
        result.dataset.applicationStatus = 'not_submitted';
        result.textContent = `Authoritative fixture status: no application exists for ${retryJobId}`;
      }

      if (scenario === 'redirect') {
        location.replace('http://localhost:8765/application-form.html?scenario=success');
        return;
      }
      if (scenario === 'cross-domain') form.action = 'https://cross-origin.invalid/collect';
      if (scenario === 'captcha') challenge.hidden = false;
      if (scenario === 'sensitive') sensitive.hidden = false;
      if (scenario === 'duplicate-control') {
        const duplicate = document.querySelector('#final-submit').cloneNode(true);
        duplicate.id = 'final-submit-duplicate';
        form.appendChild(duplicate);
      }
      if (scenario === 'already-submitted') {
        form.hidden = true;
        result.textContent = 'Application received. Receipt: FIXTURE-EXISTING-001';
        result.dataset.receipt = 'FIXTURE-EXISTING-001';
      }

      let changed = false;
      form.addEventListener('input', () => {
        if (scenario !== 'form-change' || changed) return;
        changed = true;
        form.dataset.schemaVersion = '2';
        const label = document.createElement('label');
        label.htmlFor = 'portfolio-url';
        label.textContent = 'Portfolio URL';
        const input = document.createElement('input');
        input.id = 'portfolio-url';
        input.name = 'portfolioUrl';
        input.required = true;
        form.insertBefore(label, document.querySelector('#challenge'));
        form.insertBefore(input, document.querySelector('#challenge'));
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const count = Number(sessionStorage.getItem(countKey) || '0') + 1;
        sessionStorage.setItem(countKey, String(count));
        document.body.dataset.submitCount = String(count);

        if (scenario === 'unknown') {
          document.body.dataset.applicationStatus = 'unknown';
          result.dataset.applicationStatus = 'unknown';
          result.textContent = 'Processing';
          return;
        }
        if (scenario === 'rejected') {
          document.body.dataset.applicationStatus = 'rejected';
          result.dataset.applicationStatus = 'rejected';
          result.textContent = 'Application rejected: fixture validation error';
          result.dataset.rejected = 'true';
          return;
        }

        const receipt = `FIXTURE-${String(count).padStart(3, '0')}`;
        result.textContent = `Application received. Receipt: ${receipt}`;
        result.dataset.receipt = receipt;
        result.dataset.applicationStatus = 'submitted';
        document.body.dataset.applicationStatus = 'submitted';
        form.hidden = true;
      });
    })();
  </script>
</body>
</html>
